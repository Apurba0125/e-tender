services:
  - type: web
    name: e-tender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BID_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false